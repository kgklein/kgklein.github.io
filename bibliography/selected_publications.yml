# Curated highlighted publications for kgklein.github.io.
# Match records to bibliography/ads_raw.json using normalized `title`.
# After matching, the generator may resolve and record SciX `bibcode` values.
# Keep this selection editorially maintained, independent of API refreshes.
# ARAA review omitted while under review.
selected_publications:
  - id: klein-2026-ion-scale-wave-emission
    year: 2026
    title: "Ion-Scale Wave Emission and Absorption for Non-Maxwellian Velocity Distributions in the Inner Heliosphere"
    description: >-
      Using measured ion velocity distributions from Parker Solar Probe and the
      Arbitrary Linear Plasma Solver (ALPS), we investigate how departures from
      Maxwellian distributions affect the excitation and damping of ion-scale
      plasma waves. We demonstrate that realistic velocity-space structure can
      substantially modify wave–particle energy exchange, underscoring the
      importance of using observed distributions rather than simplified analytic
      models to understand plasma heating.

  - id: martinovic-2026-oblique-drift
    year: 2026
    title: "How the Oblique Drift Instability Alters Solar Wind Heating and Constrains the Distribution of Solar Wind Observations"
    description: >-
      We investigate how relative drifts between solar-wind ion populations
      drive an oblique plasma instability that redistributes energy, heats ions,
      and regulates differential flows. This mechanism provides a possible
      explanation for observed limits on plasma beta and ion drift speeds in the
      near-Sun solar wind, connecting kinetic instability theory to the plasma
      conditions measured by Parker Solar Probe.

  - id: klein-2025-dielectric-response
    year: 2025
    title: "The dielectric response of plasmas with arbitrary gyrotropic velocity distributions"
    description: >-
      We extend the capabilities of ALPS through an improved analytic
      continuation method for calculating the response of plasmas with arbitrary
      gyrotropic velocity distributions. This development enables more accurate
      treatment of damped plasma waves and provides a framework for
      investigating how non-Maxwellian structure modifies wave properties,
      stability, and particle–wave energy exchange.

  - id: klein-2023-helioswarm
    year: 2023
    title: "HelioSwarm: A Multipoint, Multiscale Mission to Characterize Turbulence"
    description: >-
      We describe the scientific objectives and measurement strategy of NASA's
      HelioSwarm mission, which will use nine spacecraft to investigate the
      three-dimensional, multiscale structure of plasma turbulence. By
      providing simultaneous measurements across a range of spatial
      separations, HelioSwarm will enable investigations of turbulent energy
      transfer, intermittency, and plasma structures that are inaccessible to
      traditional single-spacecraft measurements.

  - id: verscharen-2019-multiscale-solar-wind
    year: 2019
    title: "The multi-scale nature of the solar wind"
    description: >-
      This review synthesizes the physical processes governing the solar wind,
      from large-scale expansion and turbulent dynamics to kinetic instabilities
      and particle heating. We emphasize how processes operating across widely
      separated spatial and temporal scales interact to shape the observed
      plasma, providing a broad framework for understanding the solar wind as a
      laboratory for fundamental plasma physics.

  - id: kasper-klein-2019-preferential-heating
    year: 2019
    title: "Strong Preferential Ion Heating is Limited to within the Solar Alfvén Surface"
    description: >-
      Using the evolution of the helium-to-proton temperature ratio as a
      diagnostic of preferential ion heating, we identify a close
      correspondence between the outer boundary of strong ion heating and the
      solar Alfvén surface. The result suggests that the most efficient
      preferential heating occurs within the magnetically dominated region of
      the solar atmosphere, providing an observational constraint on coronal
      heating processes and a prediction for Parker Solar Probe measurements.

  - id: chen-klein-howes-2019-electron-landau
    year: 2019
    title: "Evidence for electron Landau damping in space plasma turbulence"
    description: >-
      We apply the field–particle correlation technique to spacecraft
      measurements in Earth's magnetosheath, identifying a velocity-space
      signature consistent with electron Landau damping. This work provides
      observational evidence for a specific mechanism of collisionless turbulent
      energy transfer and demonstrates how measurements of particle
      distributions can distinguish the physical processes responsible for
      plasma energization.

  - id: verscharen-2018-alps
    year: 2018
    title: "ALPS: the Arbitrary Linear Plasma Solver"
    description: >-
      We introduce ALPS, a numerical framework for calculating the linear wave
      and stability properties of plasmas with arbitrary gyrotropic velocity
      distributions. By moving beyond the analytic distributions commonly
      assumed in plasma dispersion calculations, ALPS makes it possible to
      investigate wave–particle interactions and kinetic instabilities using
      more realistic representations of measured and simulated plasmas.

  - id: klein-2018-majority-instabilities
    year: 2018
    title: "Majority of Solar Wind Intervals Support Ion-Driven Instabilities"
    description: >-
      Applying the Nyquist instability criterion to measured ion distributions
      from the Wind spacecraft, we find that a majority of sampled solar-wind
      intervals support at least one ion-driven instability. By accounting
      simultaneously for temperature anisotropies and differential flows among
      ion populations, this work demonstrates that the solar wind is more
      broadly susceptible to kinetic instability than suggested by simplified
      single-parameter instability thresholds.

  - id: klein-2017-field-particle-correlations
    year: 2017
    title: "Diagnosing collisionless energy transfer using field-particle correlations: gyrokinetic turbulence"
    description: >-
      We demonstrate that field–particle correlations constructed from
      single-point measurements of electromagnetic gyrokinetic turbulence can
      identify velocity-space signatures of collisionless energy transfer. This
      establishes a pathway for diagnosing the kinetic mechanisms responsible
      for turbulent dissipation using spacecraft measurements, connecting
      numerical plasma turbulence studies with observational investigations of
      particle energization.
